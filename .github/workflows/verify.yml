name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: find scripts .agents/skills -type f -name '*.sh' -print0 | xargs -0 bash -n
      - name: ShellCheck
        run: find scripts .agents/skills -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
      - name: Check relative Markdown links
        run: find README.md AGENTS.md docs .agents/skills -name '*.md' -print0 | xargs -0 perl scripts/check-markdown-links.pl
