stages:
  - verify

verify:
  stage: verify
  image: ubuntu:24.04
  tags:
    - perflab
    - size/medium
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends shellcheck
  script:
    - find scripts .agents/skills -type f -name '*.sh' -print0 | xargs -0 bash -n
    - find scripts .agents/skills -type f -name '*.sh' -print0 | xargs -0 shellcheck
    - find README.md AGENTS.md docs .agents/skills -name '*.md' -print0 | xargs -0 perl scripts/check-markdown-links.pl
